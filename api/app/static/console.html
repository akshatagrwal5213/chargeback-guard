<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>chargeback-guard</title>
<style>
:root {
  --bg: #0e1116;
  --panel: #151a21;
  --panel-2: #1b212a;
  --line: #262d38;
  --line-soft: #1f2630;
  --ink: #e6eaf0;
  --ink-dim: #9aa5b4;
  --ink-faint: #6b7686;
  --accent: #6ea8fe;
  --good: #4ec9a5;
  --warn: #e0b252;
  --bad: #e0776a;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 14px/1.5 var(--sans); -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; cursor: pointer; }
a { color: var(--accent); }

/* ---------------------------------------------------------------- layout */
.app { display: grid; grid-template-rows: auto 1fr; height: 100%; }

header {
  display: flex; align-items: center; gap: 16px;
  padding: 10px 18px; border-bottom: 1px solid var(--line);
  background: var(--panel);
}
header h1 {
  font: 600 14px/1 var(--sans); margin: 0; letter-spacing: -0.01em;
}
header h1 span { color: var(--ink-faint); font-weight: 400; }
.status { display: flex; gap: 14px; margin-left: auto; font-size: 12px; color: var(--ink-dim); }
.status b { font-weight: 500; color: var(--ink); }
.dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; margin-right: 5px; }
.dot.on { background: var(--good); } .dot.off { background: var(--bad); }

main { display: grid; grid-template-columns: 380px 1fr; min-height: 0; }
@media (max-width: 900px) { main { grid-template-columns: 1fr; } .list { max-height: 40vh; } }

/* ------------------------------------------------------------------ list */
.list { border-right: 1px solid var(--line); overflow-y: auto; background: var(--panel); }
.list-head {
  position: sticky; top: 0; z-index: 2; background: var(--panel);
  padding: 12px 14px 10px; border-bottom: 1px solid var(--line);
}
.list-head .why {
  font-size: 11px; color: var(--ink-faint); margin-top: 6px; line-height: 1.45;
}
.search { position: relative; margin-bottom: 9px; }
.search input {
  width: 100%; background: var(--bg); color: var(--ink);
  border: 1px solid var(--line); border-radius: 7px;
  padding: 7px 28px 7px 10px; font: 13px/1.4 var(--sans);
}
.search input:focus { outline: none; border-color: var(--accent); }
.search input::placeholder { color: var(--ink-faint); }
/* type=search draws its own clear button, which sat beside ours. Ours stays:
   it is styled for this palette and is the one the keyboard handler knows. */
.search input::-webkit-search-cancel-button { -webkit-appearance: none; appearance: none; }
.search .clear {
  position: absolute; right: 4px; top: 50%; transform: translateY(-50%);
  background: none; border: 0; color: var(--ink-faint); padding: 4px 7px;
  font-size: 15px; line-height: 1;
}
.search .clear:hover { color: var(--ink); }
.hits { font-size: 11px; color: var(--ink-faint); margin-top: 6px; }
.hits b { color: var(--ink-dim); font-weight: 500; }
.more {
  display: block; width: 100%; background: var(--panel-2); border: 0;
  border-top: 1px solid var(--line); padding: 11px; font-size: 12.5px;
  color: var(--ink-dim);
}
.more:hover { color: var(--ink); }
.more:disabled { color: var(--ink-faint); }

.filters { display: flex; gap: 6px; flex-wrap: wrap; }
.filters button {
  background: var(--panel-2); border: 1px solid var(--line); border-radius: 999px;
  padding: 3px 10px; font-size: 11.5px; color: var(--ink-dim);
}
.filters button[aria-pressed="true"] { color: var(--ink); border-color: var(--accent); }

.row {
  display: block; width: 100%; text-align: left; background: none; border: 0;
  border-bottom: 1px solid var(--line-soft); padding: 11px 14px;
}
.row:hover { background: var(--panel-2); }
.row[aria-selected="true"] { background: var(--panel-2); box-shadow: inset 2px 0 0 var(--accent); }
.row-top { display: flex; align-items: baseline; gap: 8px; }
.row .amount { font: 500 14px/1 var(--mono); }
.row .cat { font-size: 12px; color: var(--ink-dim); }
.row-bot {
  display: flex; align-items: center; gap: 8px; margin-top: 6px;
  font-size: 11.5px; color: var(--ink-faint);
}
.row .ev { font-family: var(--mono); margin-left: auto; }
.ev.pos { color: var(--good); } .ev.neg { color: var(--ink-faint); }

.pill {
  font-size: 10.5px; letter-spacing: .04em; text-transform: uppercase;
  padding: 2px 6px; border-radius: 4px; border: 1px solid transparent;
}
.pill.contest { color: var(--good); border-color: #234c40; background: #14251f; }
.pill.accept  { color: var(--warn); border-color: #4a3d1e; background: #241f12; }
.pill.live    { color: var(--accent); border-color: #26405f; background: #131c28; }
.pill.filled  { color: var(--good); }
.pill.weak    { color: var(--warn); }
.pill.missing { color: var(--ink-faint); }

/* ----------------------------------------------------------------- detail */
.detail { overflow-y: auto; padding: 20px 24px 60px; min-width: 0; }
.empty { color: var(--ink-faint); padding: 60px 24px; text-align: center; }

.card {
  background: var(--panel); border: 1px solid var(--line);
  border-radius: 10px; padding: 16px 18px; margin-bottom: 14px;
}
.card h2 {
  font: 600 11px/1 var(--sans); letter-spacing: .08em; text-transform: uppercase;
  color: var(--ink-faint); margin: 0 0 12px;
}
.head-line { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.head-line .big { font: 600 24px/1.1 var(--mono); letter-spacing: -0.02em; }
.meta { display: flex; gap: 18px; flex-wrap: wrap; margin-top: 10px; font-size: 12px; }
.meta div { color: var(--ink-faint); }
.meta b { display: block; color: var(--ink); font-weight: 500; font-family: var(--mono); }

/* decision */
.verdict { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
.verdict .word { font: 600 20px/1 var(--sans); letter-spacing: -0.01em; }
.verdict .word.contest { color: var(--good); } .verdict .word.accept { color: var(--warn); }
.bar { position: relative; height: 6px; background: var(--panel-2); border-radius: 3px; margin: 14px 0 6px; }
.bar .fill { position: absolute; inset: 0 auto 0 0; background: var(--accent); border-radius: 3px; }
.bar .mark { position: absolute; top: -4px; width: 2px; height: 14px; background: var(--ink-dim); }
.bar-legend { display: flex; justify-content: space-between; font-size: 11px; color: var(--ink-faint); }
.reasons { margin: 12px 0 0; padding-left: 16px; color: var(--ink-dim); font-size: 13px; }
.reasons li { margin: 3px 0; }
.flips {
  margin-top: 12px; padding: 10px 12px; border-radius: 7px;
  background: #241f12; border: 1px solid #4a3d1e; color: #e8d5a8; font-size: 13px;
}
.flips.conduct { background: #2a1a18; border-color: #573028; color: #f0c3ba; }

/* checklist */
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th {
  text-align: left; font: 500 11px/1 var(--sans); letter-spacing: .06em;
  text-transform: uppercase; color: var(--ink-faint); padding: 0 8px 8px 0;
}
td { padding: 6px 8px 6px 0; border-top: 1px solid var(--line-soft); vertical-align: top; }
td.slot { font-family: var(--mono); font-size: 12px; white-space: nowrap; }
td.val { color: var(--ink-dim); font-size: 12px; }
tr.req td.slot { color: var(--ink); }
tr:not(.req) td.slot { color: var(--ink-faint); }

/* packet */
.claim { padding: 9px 0; border-top: 1px solid var(--line-soft); }
.claim:first-child { border-top: 0; }
.claim p { margin: 0 0 6px; }
.chips { display: flex; gap: 5px; flex-wrap: wrap; }
.chip {
  font: 400 11px/1 var(--mono); padding: 3px 7px; border-radius: 5px;
  background: var(--panel-2); border: 1px solid var(--line); color: var(--ink-dim);
}
.chip:hover, .chip[aria-expanded="true"] { border-color: var(--accent); color: var(--ink); }
.record {
  margin: 8px 0 2px; padding: 10px 12px; border-radius: 7px;
  background: #10151c; border: 1px solid var(--line);
}
.record .rk { font-size: 11px; color: var(--ink-faint); margin-bottom: 4px; }
.record .rs { font-size: 13px; margin-bottom: 8px; }
.record dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 14px; margin: 0; font-size: 12px; }
.record dt { color: var(--ink-faint); font-family: var(--mono); }
.record dd { margin: 0; font-family: var(--mono); color: var(--ink-dim); word-break: break-word; }

.summary { font-size: 14.5px; line-height: 1.6; margin: 0 0 14px; }
.gaps { margin: 12px 0 0; padding: 10px 12px; border-radius: 7px;
        background: var(--panel-2); font-size: 12.5px; color: var(--ink-dim); }
.gaps b { display: block; color: var(--ink-faint); font-size: 11px;
          letter-spacing: .06em; text-transform: uppercase; margin-bottom: 5px; }

.guardline { display: flex; gap: 16px; font-size: 12px; margin-top: 14px;
             padding-top: 12px; border-top: 1px solid var(--line-soft); }
.guardline span { color: var(--ink-faint); }
.guardline b { font-family: var(--mono); }

/* actions */
.actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.btn {
  background: var(--panel-2); border: 1px solid var(--line); border-radius: 7px;
  padding: 7px 13px; font-size: 13px;
}
.btn:hover:not(:disabled) { border-color: var(--accent); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.primary { background: #1c2c44; border-color: #2c4468; color: #cfe0ff; }
.note { font-size: 12px; color: var(--ink-faint); }

.result { margin-top: 12px; padding: 12px 14px; border-radius: 8px; font-size: 13px; }
.result.ok { background: #14251f; border: 1px solid #234c40; }
.result.refused { background: #241f12; border: 1px solid #4a3d1e; color: #e8d5a8; }
.result.err { background: #2a1a18; border: 1px solid #573028; color: #f0c3ba; }
/* The link out to Stripe is the one thing in this box anyone clicks, and it
   has to survive a re-render and be findable in a screen recording. */
.result .go {
  display: inline-block; margin-top: 10px; padding: 7px 12px;
  border: 1px solid #2f6b58; border-radius: 6px; background: #183227;
  color: #8ff0c4; text-decoration: none; font-weight: 600;
}
.result .go:hover { background: #1d4034; border-color: #3d8a71; }
.result pre {
  margin: 8px 0 0; font: 11.5px/1.5 var(--mono); white-space: pre-wrap;
  color: var(--ink-dim); max-height: 220px; overflow: auto;
}
.spin { display: inline-block; animation: sp 1s linear infinite; }
@keyframes sp { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>chargeback<span>-guard</span></h1>
    <div class="status" id="status"></div>
  </header>
  <main>
    <div class="list">
      <div class="list-head">
        <div class="search">
          <input id="q" type="search" autocomplete="off" spellcheck="false"
                 placeholder="dispute id, du_…, order, email, amount, reason…">
          <button class="clear" id="clear" hidden title="clear">&times;</button>
        </div>
        <div class="filters" id="filters"></div>
        <div class="why" id="why">Ordered by expected value. The ordering is the
          product: the top of this list is where the money is.</div>
      </div>
      <div id="rows"></div>
    </div>
    <div class="detail" id="detail">
      <div class="empty">Select a dispute.</div>
    </div>
  </main>
</div>

<script>
const API = "";
const state = { disputes: [], id: null, detail: null, packet: null,
                filter: "all", q: "", busy: null, seq: 0,
                limit: 60, total: 0, result: null };

const money = n => "₹" + Number(n || 0).toLocaleString("en-IN", {maximumFractionDigits: 0});
const pct = n => (Number(n || 0) * 100).toFixed(0) + "%";
const esc = s => String(s ?? "").replace(/[&<>"]/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const title = s => String(s || "").replace(/_/g, " ");

async function api(path, method = "GET") {
  const r = await fetch(API + path, { method });
  let body = null;
  try { body = await r.json(); } catch (e) { body = null; }
  return { status: r.status, body };
}

/* ------------------------------------------------------------------ boot */
async function boot() {
  const { body: h } = await api("/health");
  document.getElementById("status").innerHTML = h ? `
    <div><span class="dot ${h.components.database === "ok" ? "on" : "off"}"></span>database</div>
    <div><span class="dot ${h.components.stripe === "configured" ? "on" : "off"}"></span>stripe</div>
    <div>agent <b>${esc(h.components.agent)}</b></div>
    <div><b>${esc(h.mode)}</b></div>` : "";

  document.getElementById("filters").innerHTML = [
    ["all", "All"], ["processor", "Live"], ["needs_response", "Open"],
  ].map(([k, label]) =>
    `<button data-f="${k}" aria-pressed="${state.filter === k}">${label}</button>`).join("");
  document.getElementById("filters").onclick = e => {
    const b = e.target.closest("button"); if (!b) return;
    state.filter = b.dataset.f;
    state.limit = 60;
    for (const other of e.currentTarget.querySelectorAll("button"))
      other.setAttribute("aria-pressed", String(other === b));
    loadInbox();
  };
  wireSearch();
  await loadInbox();
}

/* Debounced, and every response carries the sequence number of the request
   that asked for it. Without that, a slow answer for "du_" can land after the
   fast one for "du_1U9p7w" and quietly replace the results you were reading. */
function wireSearch() {
  const box = document.getElementById("q");
  const clear = document.getElementById("clear");
  if (box.dataset.wired) { box.value = state.q; return; }
  box.dataset.wired = "1";

  let timer = null;
  const run = () => {
    state.q = box.value.trim();
    clear.hidden = !state.q;
    state.limit = 60;                 // a new question starts at the top
    loadInbox();
  };
  box.addEventListener("input", () => {
    clearTimeout(timer);
    timer = setTimeout(run, 220);
  });
  box.addEventListener("keydown", e => {
    if (e.key === "Enter") { clearTimeout(timer); run(); }
    if (e.key === "Escape") { box.value = ""; clearTimeout(timer); run(); }
  });
  clear.onclick = () => { box.value = ""; run(); box.focus(); };
  box.focus();          // first paint only — the wired guard above returns early
}

async function loadInbox() {
  let path = "/disputes?limit=" + state.limit;
  if (state.filter === "processor") path += "&origin=processor";
  if (state.filter === "needs_response") path += "&status=needs_response";
  if (state.q) path += "&q=" + encodeURIComponent(state.q);

  const seq = ++state.seq;
  const { body } = await api(path);
  if (seq !== state.seq) return;             // a newer search already answered

  state.disputes = (body && body.disputes) || [];
  state.total = (body && body.total) || state.disputes.length;
  renderRows();
  renderHits();
  if (state.q && state.disputes.length === 1) select(state.disputes[0].id);
  else if (!state.id && state.disputes.length) select(state.disputes[0].id);
}

function renderHits() {
  const why = document.getElementById("why");
  if (!why) return;
  const shown = state.disputes.length, total = state.total;
  const of = total > shown ? `<b>${shown}</b> of <b>${total.toLocaleString()}</b>`
                           : `<b>${total.toLocaleString()}</b>`;
  if (!state.q) {
    why.innerHTML = `${of} ordered by expected value — a worklist, not a table:
      the top is where the money is.`;
    return;
  }
  why.innerHTML = total
    ? `${of} match${total === 1 ? "" : "es"} for “${esc(state.q)}”`
    : `Nothing matches “${esc(state.q)}”. Searched id, processor id, order,
       customer, amount, category, reason code and status.`;
}

function renderRows() {
  const html = state.disputes.map(d => {
    const ev = Number(d.expected_value ?? NaN);
    const rec = d.recommendation;
    return `<button class="row" data-id="${d.id}" aria-selected="${d.id === state.id}">
      <div class="row-top">
        <span class="amount">${money(d.amount)}</span>
        <span class="cat">${esc(title(d.category))}</span>
      </div>
      <div class="row-bot">
        ${rec ? `<span class="pill ${rec}">${rec}</span>` : `<span class="pill missing">untriaged</span>`}
        ${d.origin === "processor" ? `<span class="pill live">live</span>` : ""}
        ${Number(d.packet_count) > 0 ? `<span title="a packet is drafted">◆</span>` : ""}
        <span class="ev ${ev > 0 ? "pos" : "neg"}">${Number.isFinite(ev) ? money(ev) : "—"}</span>
      </div>
    </button>`;
  }).join("");
  const hidden = Math.max(0, state.total - state.disputes.length);
  const more = hidden
    ? `<button class="more" data-more="1">Show 60 more · ${hidden.toLocaleString()} below the line</button>`
    : (state.disputes.length > 60
        ? `<div class="more" style="border-top:1px solid var(--line)">
             That is all ${state.total.toLocaleString()} of them.</div>`
        : "");

  const el = document.getElementById("rows");
  el.innerHTML = (html ||
    `<div class="empty">No disputes. Run <code>make seed-disputes</code>.</div>`) + more;
  el.onclick = e => {
    if (e.target.closest("[data-more]")) {
      e.target.closest("[data-more]").disabled = true;
      state.limit = Math.min(state.limit + 60, 500);
      return loadInbox();
    }
    const b = e.target.closest(".row"); if (b) select(b.dataset.id);
  };
}

/* ---------------------------------------------------------------- detail */
async function select(id) {
  // The previous dispute's banner goes at once, not when the fetches land —
  // the old detail card stays on screen while they do.
  if (id !== state.id) clearResult();
  state.id = id; state.packet = null; renderRows();
  const [base, triage, packet] = await Promise.all([
    api(`/disputes/${id}`), api(`/disputes/${id}/triage`), api(`/disputes/${id}/packet`),
  ]);
  state.detail = { ...(base.body || {}), triage: triage.body || null };
  state.packet = packet.status === 200 ? normalisePacket(packet.body) : null;
  renderDetail();
}

/* A stored packet and a freshly drafted one arrive in different shapes: the
   stored row keeps its citations in a table, the fresh one has them inline.
   The screen should not care which it is looking at. */
function normalisePacket(body) {
  if (!body) return null;
  if (body.claims) return body;                       // freshly drafted
  const p = body.packet || {};
  const claims = [];
  for (const c of body.citations || []) {
    const ref = `${c.source_table}:${c.source_id}`;
    const last = claims[claims.length - 1];
    if (last && last.text === c.claim) last.refs.push(ref);
    else claims.push({ text: c.claim, refs: [ref] });
  }
  const narrative = p.narrative || "";
  return {
    stored: true,
    summary: narrative.split("\n\n")[0] || "",
    narrative, claims,
    evidence: typeof p.evidence === "string" ? JSON.parse(p.evidence) : (p.evidence || {}),
    guard: typeof p.guard === "string" ? JSON.parse(p.guard) : (p.guard || {}),
    gaps_acknowledged: typeof p.gaps === "string" ? JSON.parse(p.gaps) : (p.gaps || []),
    provider: p.agent_model || "template",
    submitted_at: p.submitted_at,
  };
}

function recordFor(ref) {
  const ev = (state.packet && state.packet.evidence) || {};
  for (const tool of ev.tools || [])
    for (const r of tool.records || []) if (r.ref === ref) return r;
  return null;
}

function renderDetail() {
  const d = state.detail;
  if (!d || !d.dispute) {
    document.getElementById("detail").innerHTML = `<div class="empty">Select a dispute.</div>`;
    return;
  }
  const x = d.dispute, dec = (d.triage || {}).decision || {};
  const due = x.respond_by ? new Date(x.respond_by) : null;
  const days = due ? Math.round((due - Date.now()) / 86400000) : null;

  document.getElementById("detail").innerHTML = `
    <div class="card">
      <div class="head-line">
        <span class="big">${money(x.amount)}</span>
        <span class="pill ${dec.recommendation || "missing"}">${esc(dec.recommendation || "untriaged")}</span>
        ${x.origin === "processor" ? `<span class="pill live">live at stripe</span>` : ""}
      </div>
      <div class="meta">
        <div>category<b>${esc(title(x.category))}</b></div>
        <div>phase<b>${esc(x.phase || "chargeback")}</b></div>
        <div>respond by<b>${due ? due.toISOString().slice(0, 10) + (days !== null ? ` (${days}d)` : "") : "—"}</b></div>
        <div>dispute<b>${esc(x.id)}</b></div>
        ${x.processor_dispute_id ? `<div>processor<b>${esc(x.processor_dispute_id)}</b></div>` : ""}
      </div>
    </div>
    ${decisionCard(dec)}
    ${checklistCard(d)}
    ${packetCard()}
    ${submitCard(dec)}`;

  document.getElementById("detail").onclick = onDetailClick;
}

function decisionCard(dec) {
  if (!dec.recommendation) return "";
  const p = dec.win_probability, t = dec.break_even_probability;
  const conduct = /conduct/.test(dec.flips_if || "");
  return `<div class="card">
    <h2>Decision</h2>
    <div class="verdict">
      <span class="word ${dec.recommendation}">${dec.recommendation === "contest" ? "Contest" : "Accept"}</span>
      <span class="note">expected value ${money(dec.expected_value)} ·
        ${pct(dec.completeness)} of required evidence on file</span>
    </div>
    <div class="bar">
      <div class="fill" style="width:${Math.min(100, p * 100)}%"></div>
      <div class="mark" style="left:${Math.min(100, t * 100)}%"></div>
    </div>
    <div class="bar-legend">
      <span>P(win) ${pct(p)}</span>
      <span>break-even ${pct(t)}</span>
    </div>
    <ul class="reasons">${(dec.reasons || []).map(r => `<li>${esc(r)}</li>`).join("")}</ul>
    ${dec.flips_if ? `<div class="flips ${conduct ? "conduct" : ""}">${esc(dec.flips_if)}</div>` : ""}
  </div>`;
}

function checklistCard(d) {
  const rows = ((d.triage || {}).evidence) || [];
  if (!rows.length) return "";
  return `<div class="card">
    <h2>Evidence checklist — ${esc(title(d.checklist ? d.checklist.label : ""))}</h2>
    <table>
      <thead><tr><th>Slot</th><th>State</th><th>What is on file</th></tr></thead>
      <tbody>${rows.map(r => `<tr class="${r.required ? "req" : ""}">
        <td class="slot">${esc(title(r.slot))}${r.required ? "" : " ·"}</td>
        <td><span class="pill ${r.strength}">${r.strength}</span></td>
        <td class="val">${esc(r.value || "—")}</td>
      </tr>`).join("")}</tbody>
    </table>
    <div class="note" style="margin-top:10px">Rows marked · are supporting, not required.</div>
  </div>`;
}

function packetCard() {
  const p = state.packet;
  if (!p) return `<div class="card">
    <h2>Evidence packet</h2>
    <div class="note">Not drafted yet.</div>
  </div>`;

  const g = p.guard || {};
  return `<div class="card">
    <h2>Evidence packet ${p.stored ? "· stored" : "· just drafted"}</h2>
    <p class="summary">${esc(p.summary)}</p>
    ${p.claims.map((c, i) => `<div class="claim">
      <p>${esc(c.text)}</p>
      <div class="chips">${c.refs.map(ref =>
        `<button class="chip" data-ref="${esc(ref)}" data-claim="${i}"
           aria-expanded="false">${esc(ref)}</button>`).join("")}</div>
      <div class="rec-slot" data-for="${i}"></div>
    </div>`).join("")}
    ${(p.gaps_acknowledged || []).length ? `<div class="gaps"><b>Acknowledged gaps</b>
      ${p.gaps_acknowledged.map(x => esc(x)).join("<br>")}</div>` : ""}
    <div class="guardline">
      <span>written by <b>${esc(p.provider || "template")}</b></span>
      <span>kept <b>${g.claims_kept ?? p.claims.length}</b></span>
      <span>deleted <b>${g.claims_rejected ?? 0}</b></span>
      <span>flagged <b>${g.claims_flagged ?? 0}</b></span>
      <span>${g.submittable === false ? "<b>not submittable</b>" : "submittable"}</span>
    </div>
  </div>`;
}

function submitCard(dec) {
  const drafted = !!state.packet;
  const busy = state.busy;
  return `<div class="card">
    <h2>Actions</h2>
    <div class="actions">
      <button class="btn primary" data-act="draft" ${busy ? "disabled" : ""}>
        ${busy === "draft" ? '<span class="spin">◜</span> drafting…' : (drafted ? "Redraft packet" : "Draft packet")}</button>
      <button class="btn" data-act="dry_run" ${!drafted || busy ? "disabled" : ""}>Dry run</button>
      <button class="btn" data-act="stage" ${!drafted || busy ? "disabled" : ""}>
        ${busy === "stage" ? '<span class="spin">◜</span> staging…' : "Stage at processor"}</button>
      ${drafted ? `<a class="note" href="/disputes/${state.id}/packet.html" target="_blank">open as a document ↗</a>` : ""}
    </div>
    <div class="note" style="margin-top:8px">
      Staging is a real API call with <code>submit=false</code>: the evidence lands on the
      dispute and is not sent to the issuing bank <em>by this system</em>. Stripe's own
      Smart Disputes may auto-submit before the deadline unless it is turned off.
    </div>
    <div id="result">${state.result
      ? `<div class="result ${state.result.cls}">${state.result.html}</div>` : ""}</div>
  </div>`;
}

/* --------------------------------------------------------------- actions */
async function onDetailClick(e) {
  const chip = e.target.closest(".chip");
  if (chip) return toggleRecord(chip);
  const btn = e.target.closest("[data-act]");
  if (!btn) return;
  const act = btn.dataset.act;
  if (act === "draft") return draft();
  return submit(act);
}

function toggleRecord(chip) {
  const slot = chip.closest(".claim").querySelector(".rec-slot");
  const open = chip.getAttribute("aria-expanded") === "true";
  chip.closest(".claim").querySelectorAll(".chip").forEach(c =>
    c.setAttribute("aria-expanded", "false"));
  if (open) { slot.innerHTML = ""; return; }
  chip.setAttribute("aria-expanded", "true");
  const r = recordFor(chip.dataset.ref);
  slot.innerHTML = r ? `<div class="record">
    <div class="rk">${esc(r.ref)} · ${esc(title(r.kind))}</div>
    <div class="rs">${esc(r.summary)}</div>
    <dl>${Object.entries(r.fields || {}).map(([k, v]) =>
      `<dt>${esc(k)}</dt><dd>${esc(v === null ? "—" : v)}</dd>`).join("")}</dl>
  </div>` : `<div class="record"><div class="rk">${esc(chip.dataset.ref)}</div>
    <div class="rs">This record is not in the stored packet.</div></div>`;
}

/* The result of the last action, kept on `state` rather than only in the DOM.
   Staging used to write the Stripe link straight into #result and then call
   select() to refresh the dispute — whose fetches landed two seconds later,
   re-rendered the Actions card and threw the link away before it could be
   clicked. Now every render puts it back, and it stays until the next action
   or a different dispute replaces it. */
function showResult(cls, html) {
  state.result = { cls, html };
  paintResult();
}

function clearResult() {
  state.result = null;
  paintResult();
}

function paintResult() {
  const el = document.getElementById("result");
  if (!el) return;                                     // not rendered yet
  const r = state.result;
  el.innerHTML = r ? `<div class="result ${r.cls}">${r.html}</div>` : "";
}

async function draft() {
  state.busy = "draft"; clearResult(); renderDetail();
  const { status, body } = await api(`/disputes/${state.id}/packet`, "POST");
  state.busy = null;

  if (status === 200 && body.status === "not_drafted") {
    state.packet = null; renderDetail();
    showResult("refused", `<b>Not drafted.</b><br>${esc(body.reason)}`);
    return;
  }
  if (status !== 200) {
    renderDetail();
    showResult("err", `<b>${status}</b> ${esc((body && body.detail) || "failed")}`);
    return;
  }
  state.packet = body;
  renderDetail();
  showResult("ok", `Drafted in ${body.timings.draft}s by <b>${esc(body.provider)}</b> —
    ${body.claims.length} claim(s) from ${body.citable_records} retrieved record(s).
    ${body.provider_note ? `<br><span class="note">${esc(body.provider_note)}</span>` : ""}`);
  loadInbox();
}

async function submit(mode) {
  state.busy = mode; clearResult(); renderDetail();
  const { status, body } = await api(
    `/disputes/${state.id}/submit?mode=${mode}`, "POST");
  state.busy = null; renderDetail();

  if (status === 409) {
    showResult("refused", `<b>Refused.</b><br>${esc(body.detail)}`);
    return;
  }
  if (status !== 200) {
    showResult("err", `<b>${status}</b> ${esc((body && body.detail) || "failed")}`);
    return;
  }
  if (body.mode === "dry_run") {
    showResult("ok", `<b>Dry run — nothing was sent.</b><br>
      <span class="note">${esc(body.reason)}</span>
      <pre>${esc(body.endpoint)}\n\n${esc(JSON.stringify(body.payload, null, 2))}</pre>`);
    return;
  }
  if (body.ok) {
    showResult("ok", `<b>Staged at ${esc(body.rail)}</b> — ${body.characters} characters,
      not sent to the bank by us.<br>
      <a class="go" href="${esc(body.dashboard)}" target="_blank"
         rel="noopener">open the dispute at Stripe ↗</a>`);
    select(state.id);
    return;
  }
  showResult("err", `<b>${esc(body.mode)}</b> — ${esc((body.error || {}).message || "rejected")}
    ${body.hint ? `<br><span class="note">${esc(body.hint)}</span>` : ""}`);
}

boot();
</script>
</body>
</html>
