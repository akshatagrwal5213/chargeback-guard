[pytest]
pythonpath = .
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = tests

# Third-party noise, filtered narrowly by message so a real deprecation in
# our own code still surfaces. shap's colour module emits one of these per
# colormap entry at import — 909 warnings on a clean run, which trains anyone
# reading the output to ignore all of it.
filterwarnings =
    ignore::DeprecationWarning:pytest_asyncio.*
    ignore:Converting `np.inexact`:DeprecationWarning
    ignore:.*TreeExplainer shap values output.*:UserWarning
